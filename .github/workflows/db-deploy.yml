name: Database Deploy to ECR and RDS

on:
  push:
    branches: [deploy]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 061532289995.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: innovatech/db
  RDS_ENDPOINT: innovatech-rds.cjctjveok13v.us-east-1.rds.amazonaws.com
  DB_NAME: innovatech_ops
  DB_USER: innovatech_user

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
      
      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Run migrations against RDS
        run: |
          docker run --rm --entrypoint mysql \
            mysql:8.0 \
            -h ${{ env.RDS_ENDPOINT }} \
            -u ${{ env.DB_USER }} \
            -pinnovatech_password \
            ${{ env.DB_NAME }} < ./schema.sql || true

          docker run --rm --entrypoint mysql \
            mysql:8.0 \
            -h ${{ env.RDS_ENDPOINT }} \
            -u ${{ env.DB_USER }} \
            -pinnovatech_password \
            ${{ env.DB_NAME }} < ./seed.sql || true

          echo "Migrations applied to RDS"
